[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunroute"
version = "0.1.0"
description = "Democratised edge–cloud AI inference: community-owned, energy-aware, fair routing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # ── Web / API ────────────────────────────
    # Using >= to allow Python 3.14-compatible wheels
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "httpx>=0.28",

    # ── Data ─────────────────────────────────
    "pyarrow>=18.0",
    "duckdb>=1.1",

    # ── Simulation ───────────────────────────
    "simpy>=4.1",
    "networkx>=3.4",
    "pvlib>=0.11",
    "windpowerlib>=0.2.2",
    "numpy>=2.2",
    "pandas>=2.2",

    # ── Config ───────────────────────────────
    "pyyaml>=6.0",

    # ── AWS (used only in cloud/ and infra/) ─
    "boto3>=1.36",

    # ── Utilities ────────────────────────────
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pre-commit>=4.1",
    "detect-secrets>=1.5",
    "httpx>=0.28",  # also used for test client
]

jetson = [
    # Jetson-specific deps; jtop requires system install
    "psutil>=6.1",
]

dashboard = [
    # Dashboard Python deps (React is separate via npm)
    "sse-starlette>=2.2",
    "websockets>=14.2",
]

[tool.setuptools.packages.find]
include = ["edge*", "router*", "gateway*", "simulator*", "cloud*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["edge", "router", "gateway", "simulator", "cloud", "tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
